name: settimer
description: "SetTimer - A minimalist workout timer for set-based workouts, HIIT, and interval training. Focus on your workout while we handle the timing."
homepage: https://yusufhan.dev/
repository: https://github.com/JosephDoUrden/settimer

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 2.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_ringtone_player: ^4.0.0+4
  audioplayers: ^5.2.1
  path_provider: ^2.0.0

  # Voice Coaching & TTS
  flutter_tts: 4.2.3

  # Local Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2

  # Date formatting and UUID generation
  intl: ^0.19.0
  uuid: ^4.2.1

  # Charts and analytics
  fl_chart: ^0.65.0

  # Screen wakelock to prevent screen from locking during workouts
  wakelock_plus: 1.2.11

  cupertino_icons: ^1.0.8
  http: ^1.4.0

  # Hands-free boxing control: phone proximity sensor
  proximity_sensor: 1.3.10

dependency_overrides:
  # Keep the transitive package_info_plus version compatible with this project's Android toolchain.
  package_info_plus: 8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/classic/
    - assets/sounds/gym/
    - assets/sounds/nature/
    - assets/sounds/electronic/
    - assets/sounds/minimal/
